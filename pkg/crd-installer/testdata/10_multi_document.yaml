# Three CRDs in one file, the middle one broken: x-kubernetes-sensitive-data is a bool,
# so the schema cannot be decoded. The other two must still be installed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firsts.example.com
spec:
  group: example.com
  names:
    kind: First
    listKind: FirstList
    plural: firsts
    singular: first
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: broken.example.com
spec:
  group: example.com
  names:
    kind: Broken
    listKind: BrokenList
    plural: broken
    singular: broken
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            token:
              type: string
              x-kubernetes-sensitive-data: "yes"
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lasts.example.com
spec:
  group: example.com
  names:
    kind: Last
    listKind: LastList
    plural: lasts
    singular: last
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
