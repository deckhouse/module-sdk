apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: extensions.example.com
spec:
  group: example.com
  names:
    kind: Extension
    listKind: ExtensionList
    plural: extensions
    singular: extension
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-doc-examples:
            - at the root
          x-description: at the root
          properties:
            spec:
              type: object
              properties:
                token:
                  type: string
                  x-kubernetes-sensitive-data: true
                  x-doc-examples:
                    - next to a field that must survive
                tags:
                  type: array
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                    x-doc-examples:
                      - inside items
                labels:
                  type: object
                  additionalProperties:
                    type: string
                    x-doc-examples:
                      - inside additionalProperties
                free:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                # keys that look official but are not fields of JSONSchemaProps,
                # so a "keep everything x-kubernetes-*" rule would leak them
                legacy:
                  type: string
                  x-kubernetes-immutable: true
                  x-kubernetes-patch-strategy: merge
                  x-examples:
                    - legacy
                  x-doc-default: legacy
