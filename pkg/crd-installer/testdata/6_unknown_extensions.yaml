apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: extensions.example.com
spec:
  group: example.com
  names:
    kind: Extension
    listKind: ExtensionList
    plural: extensions
    singular: extension
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-doc-examples:
            - at the root
          properties:
            spec:
              type: object
              properties:
                token:
                  type: string
                  # the one extension that must survive, next to one that must not
                  x-kubernetes-sensitive-data: true
                  x-doc-examples:
                    - deep in the tree
