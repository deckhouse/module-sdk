# The CRD as a module actually ships it: x-doc-* keys the apiserver prunes, whole-number
# bounds it returns as int64, and no spec.names.singular/listKind because it defaults
# those itself. Applying this over 7_churn_stored.yaml must be a no-op — there is nothing
# the cluster does not already have.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: churns.example.com
spec:
  group: example.com
  names:
    kind: Churn
    plural: churns
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-doc-examples:
            - at the root
          properties:
            spec:
              type: object
              properties:
                token:
                  type: string
                  x-kubernetes-sensitive-data: true
                  x-doc-default: ""
                  x-doc-examples:
                    - a token
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  multipleOf: 2
                  x-doc-examples:
                    - 8080
    - name: v1alpha1
      served: true
      schema:
        openAPIV3Schema:
          type: object
