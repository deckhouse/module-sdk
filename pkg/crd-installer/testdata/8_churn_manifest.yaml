# 7_churn_stored.yaml plus the x-doc-* keys a module actually ships. Applying this over
# the stored state must be a no-op: the doc keys never reach the cluster, so there is
# nothing to reconcile.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: churns.example.com
spec:
  group: example.com
  names:
    kind: Churn
    listKind: ChurnList
    plural: churns
    singular: churn
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-doc-examples:
            - at the root
          properties:
            spec:
              type: object
              properties:
                token:
                  type: string
                  x-kubernetes-sensitive-data: true
                  x-doc-default: ""
                  x-doc-examples:
                    - a token
